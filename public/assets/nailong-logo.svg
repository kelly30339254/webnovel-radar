<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241c31"/>
      <stop offset="1" stop-color="#120e1a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd95e"/>
      <stop offset="1" stop-color="#f7b733"/>
    </linearGradient>
  </defs>

  <!-- 深色圆角玻璃底 -->
  <rect x="2" y="2" width="92" height="92" rx="24" fill="url(#bg)"/>
  <rect x="2" y="2" width="92" height="92" rx="24" fill="url(#sheen)"/>
  <rect x="2.75" y="2.75" width="90.5" height="90.5" rx="23.25" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- 小角 -->
  <path d="M31 26 q-2.5 -9 5 -12 q4 6 1 13 z" fill="#f5a623"/>
  <path d="M65 26 q2.5 -9 -5 -12 q-4 6 -1 13 z" fill="#f5a623"/>

  <!-- 圆胖身体/脸 -->
  <ellipse cx="48" cy="55" rx="31" ry="27" fill="url(#body)"/>

  <!-- 奶白肚皮 -->
  <ellipse cx="48" cy="68" rx="17" ry="11" fill="#fff3d6"/>

  <!-- 眼睛 -->
  <ellipse cx="37" cy="48" rx="4.6" ry="6.2" fill="#2b1c10"/>
  <ellipse cx="59" cy="48" rx="4.6" ry="6.2" fill="#2b1c10"/>
  <circle cx="38.6" cy="45.8" r="1.7" fill="#ffffff"/>
  <circle cx="60.6" cy="45.8" r="1.7" fill="#ffffff"/>

  <!-- 微笑 -->
  <path d="M41.5 57.5 q6.5 6 13 0" fill="none" stroke="#7a4a12" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 腮红 -->
  <ellipse cx="29" cy="57" rx="4.2" ry="2.6" fill="#ff9d9d" opacity="0.75"/>
  <ellipse cx="67" cy="57" rx="4.2" ry="2.6" fill="#ff9d9d" opacity="0.75"/>
</svg>
